[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotpilot-story-state"
version = "1.0.0"
description = "Installable PlotPilot Story-State worker"
requires-python = ">=3.12,<3.13"
dependencies = ["plotpilot-plugin-sdk==0.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
