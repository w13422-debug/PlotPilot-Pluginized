[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotpilot-plugin-sdk"
version = "0.1.2"
description = "Dependency-light PlotPilot plugin contract SDK"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "rfc8785>=0.1.4",
]

[tool.setuptools]
packages = ["plotpilot_plugin_sdk"]
include-package-data = true

[tool.setuptools.package-data]
plotpilot_plugin_sdk = ["resources/*.json"]

[tool.setuptools.package-dir]
plotpilot_plugin_sdk = "."
